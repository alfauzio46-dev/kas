<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Kas</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .box{
            width:300px;margin:100px auto;background:white;padding:20px;
            border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
        input,button{width:100%;padding:10px;margin-top:10px;}
        button{background:#007bff;color:white;border:none;border-radius:5px;}
        #msg{color:red;text-align:center;margin-top:10px;}
    </style>
</head>
<body>

<div class="box">
    <h3>Login Peserta Kas</h3>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div id="msg"></div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    fetch("data/users.json")
        .then(res => res.json())
        .then(data => {
            const found = data.find(u => u.username === user && u.password === pass);

            if (found) {
                localStorage.setItem("loginUser", user);
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("msg").innerText = "Username / password salah!";
            }
        });
}
</script>

</body>
</html>
